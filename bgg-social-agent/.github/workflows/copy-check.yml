name: copy-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'writer/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Copy checks (K1–K5)
        run: python scripts/check_copy.py output/
